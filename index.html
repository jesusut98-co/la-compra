<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La compra</title>
<meta name="theme-color" content="#F2F6F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1512" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="La compra">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F6F1; --surface:#FFFFFF; --ink:#16241C; --muted:#66756B; --line:#DDE5DD;
  --mercadona:#0B8457; --consum:#E06A00; --on-accent:#FFFFFF; --danger:#B3261E;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F1512; --surface:#18211C; --ink:#E9F0EB; --muted:#8E9C93; --line:#27332C;
    --mercadona:#35C48F; --consum:#FF9A3D; --on-accent:#0F1512; --danger:#FF8A80;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F1512; --surface:#18211C; --ink:#E9F0EB; --muted:#8E9C93; --line:#27332C;
  --mercadona:#35C48F; --consum:#FF9A3D; --on-accent:#0F1512; --danger:#FF8A80;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"Bricolage Grotesque",ui-rounded,"Segoe UI",system-ui,sans-serif;
  font-size:17px;line-height:1.35;-webkit-tap-highlight-color:transparent;
  --accent:var(--mercadona);
}
body[data-store="consum"]{--accent:var(--consum)}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.app{max-width:520px;margin:0 auto;padding:20px 16px 190px}

header{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{font-size:2.5rem;font-weight:800;letter-spacing:-.03em;line-height:1;margin:0}
.sync{font-size:.8rem;color:var(--muted);white-space:nowrap}
.summary{margin:6px 0 18px;color:var(--muted)}
.gear{flex:none;width:44px;height:44px;margin:-8px -8px 0 0;font-size:1.3rem;border-radius:12px;color:var(--muted)}
.head-right{display:flex;align-items:center;gap:6px}
.gate{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;align-items:center;justify-content:center;
  padding:calc(24px + env(safe-area-inset-top,0px)) 20px calc(24px + env(safe-area-inset-bottom,0px))}
.gate-in{width:100%;max-width:380px}
.gate h1{margin-bottom:8px}
.gate p{color:var(--muted);margin:0 0 20px}
.field{display:block;margin-bottom:12px}
.field span{display:block;font-size:.9rem;font-weight:600;margin:0 0 6px 4px}
.field input{width:100%;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);font-size:1.05rem}
.field input:focus{outline:none;border-color:var(--accent)}
.btn{display:block;width:100%;padding:15px;border-radius:14px;background:var(--accent);color:var(--on-accent);font-weight:600;font-size:1.05rem}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line);margin-top:10px}
.err{color:var(--danger);font-size:.92rem;min-height:1.3em;margin:4px 4px 10px}
.small{font-size:.85rem;color:var(--muted);margin:12px 4px 0}
.grounding{width:100%;height:96px;border:0;margin-top:8px;border-radius:12px;background:transparent}

/* Selector de tienda */
.switch{position:relative;display:grid;grid-template-columns:1fr 1fr;background:var(--surface);
  border:1px solid var(--line);border-radius:18px;padding:4px}
.switch::before{content:"";position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);
  border-radius:14px;background:var(--accent);transition:transform .28s cubic-bezier(.3,1.3,.5,1),background .28s}
body[data-store="consum"] .switch::before{transform:translateX(100%)}
.switch button{position:relative;padding:13px 8px;font-weight:600;border-radius:14px;
  display:flex;align-items:center;justify-content:center;gap:8px;color:var(--muted);transition:color .2s}
.switch button[aria-pressed="true"]{color:var(--on-accent)}
.count{min-width:1.6em;padding:1px 7px;border-radius:99px;font-size:.8rem;font-weight:600;
  background:var(--bg);color:var(--ink)}
.switch button[aria-pressed="true"] .count{background:color-mix(in srgb,var(--on-accent) 22%,transparent);color:var(--on-accent)}

/* Lista */
h2{font-size:.95rem;font-weight:600;color:var(--muted);margin:22px 4px 6px;display:flex;align-items:center;justify-content:space-between}
ul{list-style:none;margin:0;padding:0;background:var(--surface);border-radius:18px;overflow:hidden;border:1px solid var(--line)}
li + li{border-top:1px solid var(--line)}
.row{display:flex;align-items:center}
.tick{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:14px 4px 14px 14px;text-align:left}
.box{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--accent);position:relative;transition:background .15s}
.done .box{background:var(--accent)}
.done .box::after{content:"";position:absolute;left:7px;top:3px;width:6px;height:11px;
  border:solid var(--on-accent);border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.name{overflow-wrap:anywhere}
.done .name{text-decoration:line-through;color:var(--muted)}
.qty{flex:none;font-size:.85rem;font-weight:600;color:var(--accent)}
.more{flex:none;width:48px;height:48px;font-size:1.3rem;color:var(--muted);border-radius:12px}
.acts{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:0 14px 14px 50px}
.acts button{padding:8px 12px;border-radius:10px;background:var(--bg);font-size:.9rem;font-weight:600}
.acts .step{width:38px;padding:8px 0;font-size:1.1rem}
.acts .n{min-width:1.4em;text-align:center;font-weight:600}
.acts .del{color:var(--danger)}
.link{font-size:.9rem;font-weight:600;color:var(--accent);padding:4px}
.new{animation:pop .3s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

.empty{margin:40px 12px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-size:1.25rem;font-weight:600;margin-bottom:6px}

/* Barra para añadir */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--bg);border-top:1px solid var(--line);
  padding:10px 0 calc(12px + env(safe-area-inset-bottom,0px))}
.dock-in{max-width:520px;margin:0 auto}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 16px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:99px;background:var(--surface);border:1px solid var(--line);
  font-size:.92rem;white-space:nowrap}
.chip:active{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.add{display:flex;gap:8px;padding:0 16px}
.add input{flex:1;min-width:0;padding:14px 16px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);font-size:1.05rem}
.add input:focus{outline:none;border-color:var(--accent)}
.add input::placeholder{color:var(--muted)}
.add .go{flex:none;width:54px;border-radius:16px;background:var(--accent);color:var(--on-accent);
  font-size:1.7rem;font-weight:600;line-height:1;transition:background .28s}
.add .cam{flex:none;width:54px;border-radius:16px;background:var(--surface);border:1.5px solid var(--line);font-size:1.35rem;line-height:1}
.add button:active{transform:scale(.94)}
.add button[disabled]{opacity:.5}
[hidden]{display:none!important}

.txt{flex:1;min-width:0;display:flex;flex-direction:column}
.note{font-size:.82rem;color:var(--muted)}
.thumb{flex:none;width:44px;height:44px;border-radius:10px;object-fit:cover;background:var(--line)}
.big{flex-basis:100%;width:100%;max-height:260px;object-fit:contain;border-radius:14px;background:var(--surface);border:1px solid var(--line)}

.toast{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 16px 10px;padding:10px 14px;
  border-radius:14px;background:var(--ink);color:var(--bg);font-size:.92rem}
.toast button{flex:none;font-weight:600;color:inherit;text-decoration:underline;padding:4px}

/* Hoja de búsqueda */
.veil{position:fixed;inset:0;z-index:20;background:rgba(10,20,15,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:520px;max-height:86%;display:flex;flex-direction:column;background:var(--bg);
  border-radius:22px 22px 0 0;padding:18px 16px calc(14px + env(safe-area-inset-bottom,0px));animation:rise .25s ease-out}
@keyframes rise{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.sheet h3{margin:0;font-size:1.3rem;font-weight:800;letter-spacing:-.02em;overflow-wrap:anywhere}
.sheet-close{flex:none;padding:9px 16px;border-radius:12px;background:var(--accent);color:var(--on-accent);font-weight:600}
.sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet-body ul{margin-bottom:12px}
.row .pick{flex:1;min-width:0;width:auto}
.chip.star{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:600}
.sheet h2:first-of-type{margin-top:6px}
.pick{width:100%;display:flex;align-items:center;gap:12px;padding:13px 14px;text-align:left}
.pick .plus{flex:none;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--on-accent);
  display:grid;place-items:center;font-weight:600;line-height:1}
.pick.added .plus{background:none;color:var(--accent);border:2px solid var(--accent)}
.hint{margin:4px 4px 12px;font-size:.88rem;color:var(--muted)}
.hint button{color:var(--accent);font-weight:600;text-decoration:underline}

@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body data-store="mercadona">
<div class="app">
  <header>
    <h1>La compra</h1>
    <div class="head-right">
      <span class="sync" id="sync" role="status"></span>
      <button type="button" class="gear" id="gearBtn" aria-label="Ajustes">⚙︎</button>
    </div>
  </header>
  <p class="summary" id="summary"></p>

  <div class="switch" role="group" aria-label="Supermercado">
    <button type="button" data-store="mercadona">Mercadona <span class="count"></span></button>
    <button type="button" data-store="consum">Consum <span class="count"></span></button>
  </div>

  <main id="list"></main>
</div>

<div class="dock">
  <div class="dock-in">
    <div class="toast" id="toast" role="status" hidden><span id="toastText"></span><button type="button" id="toastUndo" hidden>Deshacer</button></div>
    <div class="chips" id="chips" aria-label="Productos habituales"></div>
    <div class="add">
      <button type="button" id="camBtn" class="cam" aria-label="Añadir con una foto del producto o del ticket">📷</button>
      <input type="file" id="camFile" accept="image/*" capture="environment" hidden>
      <input type="file" id="picFile" accept="image/*" hidden>
      <input id="input" type="text" autocomplete="off" autocapitalize="sentences" enterkeyhint="done"
             maxlength="60" placeholder="¿Qué falta en casa?" aria-label="Producto que falta">
      <button type="button" id="addBtn" class="go" aria-label="Buscar y añadir a la lista">+</button>
    </div>
  </div>
</div>

<div class="gate" id="gate" hidden>
  <div class="gate-in">
    <h1>La compra</h1>
    <p id="gateText">Entra con tu cuenta para ver la lista compartida.</p>
    <div id="gateForm">
      <label class="field"><span>Correo</span><input id="email" type="email" autocomplete="username" autocapitalize="off" inputmode="email"></label>
      <label class="field"><span>Contraseña</span><input id="pass" type="password" autocomplete="current-password"></label>
      <p class="err" id="gateErr" role="alert"></p>
      <button type="button" class="btn" id="loginBtn">Entrar</button>
    </div>
  </div>
</div>

<div class="veil" id="veil" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-head"><h3 id="sheetTitle"></h3><button type="button" class="sheet-close" id="sheetClose">Listo</button></div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { initializeFirestore, getFirestore, persistentLocalCache, persistentSingleTabManager,
         doc, collection, onSnapshot, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

(function(){
  "use strict";

  var STORES = {mercadona:"Mercadona", consum:"Consum"};

  // El orden importa: se usa la primera categoría que coincide.
  var CATS = [
    {id:"limpieza", name:"Limpieza e higiene", icon:"🧴", kw:["papel higienico","papel de cocina","servilleta","detergente","suavizante","lavavajillas","lejia","fregasuelos","limpia","estropajo","bayeta","bolsas de basura","gel","champu","jabon","pasta de dientes","dentifrico","cepillo","desodorante","panal","toallita","compresa","tampon","crema","colonia","maquinilla","papel de aluminio","papel film","friegasuelos","amoniaco"]},
    {id:"congelados", name:"Congelados", icon:"🧊", kw:["congelad","helado","pizza","hielo","croqueta","nugget","varitas","san jacobo"]},
    {id:"fruta", name:"Fruta y verdura", icon:"🥬", kw:["tomates","tomate ","tomate$","platano","manzana","naranja","limon","lechuga","cebolla","patata","zanahoria","ajo","pimiento","pepino","calabacin","berenjena","aguacate","fresa","uva","pera","melon","sandia","melocoton","kiwi","pina","mandarina","espinaca","brocoli","coliflor","champinon","seta","judias verdes","puerro","apio","calabaza","fruta","verdura","ensalada","perejil","cereza","mango","arandano","rucula","alcachofa","esparrago","remolacha","boniato","nectarina","ciruela","albaricoque","col"]},
    {id:"carne", name:"Carne y pescado", icon:"🥩", kw:["pollo","carne","ternera","cerdo","lomo","chuleta","hamburguesa","salchicha","jamon","chorizo","pavo","bacon","beicon","salmon","merluza","pescado","gamba","langostino","mejillon","calamar","sepia","bacalao","dorada","lubina","costilla","solomillo","pechuga","muslo","fuet","salchichon","mortadela","embutido","longaniza","morcilla","conejo","cordero","sardina fresca","boqueron","pulpo","almeja"]},
    {id:"lacteos", name:"Lácteos y huevos", icon:"🥛", kw:["leche","yogur","queso","huevo","mantequilla","nata","margarina","kefir","natilla","flan","cuajada","batido","requeson","mozzarella"]},
    {id:"pan", name:"Pan y bollería", icon:"🥖", kw:["pan","barra","baguette","bolleria","croissant","cruasan","magdalena","galleta","bizcocho","tostada","donut","ensaimada","tortitas","picos","rosquilla"]},
    {id:"bebidas", name:"Bebidas", icon:"🧃", kw:["agua","zumo","cerveza","vino","refresco","cola","tonica","gaseosa","cafe","infusion","manzanilla","cacao","horchata","cava","sidra","bebida","isotonica","tinto de verano","vermut"]},
    {id:"despensa", name:"Despensa", icon:"🥫", kw:["arroz","pasta","macarron","espagueti","fideo","aceite","vinagre","sal","azucar","harina","lenteja","garbanzo","alubia","atun","tomate frito","tomate triturado","conserva","cereal","avena","mermelada","miel","chocolate","aceituna","caldo","sopa","salsa","mayonesa","ketchup","mostaza","especia","pimienta","pimenton","oregano","levadura","frutos secos","nuez","almendra","cacahuete","patatas fritas","snack","legumbre","maiz","sardina","tortilla","cuscus","quinoa","pure","cola cao","nocilla","crema de cacao","pipas","gominola","chicle","caramelo"]}
  ];
  var OTHER = {id:"otros", name:"Otros", icon:"🛒"};

  var DEFAULTS = ["Leche","Huevos","Pan","Tomates","Plátanos","Aceite de oliva","Papel higiénico","Yogures","Pollo","Arroz","Pasta","Café","Agua","Cebollas","Patatas","Queso","Detergente","Atún","Manzanas","Lechuga","Jamón york","Mantequilla","Azúcar","Sal","Harina","Lentejas","Garbanzos","Tomate frito","Zumo","Galletas","Cereales","Lavavajillas","Gel de ducha","Zanahorias","Ajos","Limones","Naranjas","Carne picada","Salmón","Pizza"];

  function norm(s){ return String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/\s+/g," ").trim(); }

  function catOf(name){
    var n = norm(name), padded = " " + n + " ";
    // Las coincidencias más largas ganan (p. ej. «tomate frito» antes que «tomate»).
    var best = null, bestLen = 0;
    CATS.forEach(function(c){
      c.kw.forEach(function(k){
        var hit;
        if (k.charAt(k.length-1) === "$") { var w = k.slice(0,-1); hit = n === w || n.slice(-w.length-1) === " " + w; k = w; }
        else hit = padded.indexOf(" " + k) !== -1;
        if (hit && k.length > bestLen){ best = c; bestLen = k.length; }
      });
    });
    return (best || OTHER).id;
  }
  function catInfo(id){ for (var i=0;i<CATS.length;i++) if (CATS[i].id===id) return CATS[i]; return OTHER; }

  /* ---------- Estado ---------- */
  var LS = "lista-compra-v1", LS_STORE = "lista-compra-tienda";
  var state = {items:[], freq:{}, updatedAt:0};
  var store = "mercadona", openId = null, lastAdded = null;

  function clean(d){
    var out = {items:[], freq:{}, updatedAt:Number(d && d.updatedAt) || 0};
    if (d && Array.isArray(d.items)) d.items.forEach(function(i){
      if (!i || typeof i.name !== "string" || !STORES[i.store]) return;
      out.items.push({id:String(i.id), name:i.name.slice(0,80), note:typeof i.note === "string" ? i.note.slice(0,60) : "", store:i.store,
        qty:Math.max(1, Math.min(99, parseInt(i.qty,10) || 1)), done:!!i.done, cat:String(i.cat || catOf(i.name))});
    });
    if (d && d.freq && typeof d.freq === "object") Object.keys(d.freq).forEach(function(k){
      var f = d.freq[k]; if (f && typeof f.label === "string") out.freq[k] = {label:f.label.slice(0,80), n:Number(f.n)||1,
        note:typeof f.note === "string" ? f.note.slice(0,60) : "", cat:typeof f.cat === "string" ? f.cat : "",
        st:(f.st && typeof f.st === "object") ? {mercadona:!!f.st.mercadona, consum:!!f.st.consum} : null};
    });
    return out;
  }
  try { var raw = localStorage.getItem(LS); if (raw) state = clean(JSON.parse(raw)); } catch(e){}
  try { var s = localStorage.getItem(LS_STORE); if (STORES[s]) store = s; } catch(e){}

  function saveLocal(){ try { localStorage.setItem(LS, JSON.stringify(state)); } catch(e){} }

  /* Fotos de los productos (miniaturas) */
  var LS_PICS = "lista-compra-fotos", photos = {}, picsCol = null;
  function okPic(d){ return typeof d === "string" && d.indexOf("data:image/jpeg;base64,") === 0 && d.length < 200000; }
  try { var rp = JSON.parse(localStorage.getItem(LS_PICS) || "{}"); Object.keys(rp).forEach(function(k){ if (okPic(rp[k])) photos[k] = rp[k]; }); } catch(e){}
  function savePics(){ try { localStorage.setItem(LS_PICS, JSON.stringify(photos)); } catch(e){} }
  function setPhoto(id, d){
    if (!okPic(d)) return;
    photos[id] = d; savePics(); render();
    if (picsCol) setDoc(doc(picsCol, id), {d:d}).catch(function(){});
  }
  function prunePics(){
    var alive = {}, changed = false;
    state.items.forEach(function(i){ alive[i.id] = true; });
    Object.keys(photos).forEach(function(k){
      if (alive[k]) return;
      delete photos[k]; changed = true;
      if (picsCol) deleteDoc(doc(picsCol, k)).catch(function(){});
    });
    if (changed) savePics();
  }

  /* ---------- Sincronización con Firebase ---------- */
  var docRef = null, picsCol = null, saving = false, dirty = false, timer = null, unsubs = [];
  var syncEl = document.getElementById("sync");
  function setSync(t){ syncEl.textContent = t; }

  function queueSave(){
    if (!docRef) return;
    dirty = true; clearTimeout(timer); timer = setTimeout(flush, 500);
  }
  function flush(){
    if (saving || !dirty || !docRef) return;
    saving = true; dirty = false; setSync(navigator.onLine ? "Guardando…" : "Sin conexión");
    setDoc(docRef, JSON.parse(JSON.stringify(state))).then(function(){ setSync("Sincronizada"); },
      function(e){ setSync(e && e.code === "permission-denied" ? "Sin permiso" : "Sin conexión"); })
    .then(function(){ saving = false; if (dirty) flush(); });
  }
  function commit(){ state.updatedAt = Date.now(); prunePics(); saveLocal(); render(); queueSave(); }

    sheetBody.textContent = "";
    sheetBody.appendChild(h("ul", null, pickRow(label, "Tal cual, sin marca concreta", null)));
    var status = h("p", {"class":"hint", text:"Buscando marcas y variedades…"});
    sheetBody.appendChild(status);
    veil.hidden = false; sheetClose.focus();

    function show(list){
      var ul = h("ul"), n = 0;
      (Array.isArray(list) ? list : []).slice(0, 30).forEach(function(r){
        if (!r || typeof r.nombre !== "string" || !r.nombre.trim()) return;
        ul.appendChild(pickRow(r.nombre, typeof r.formato === "string" ? r.formato : "", r.categoria)); n++;
      });
      if (!n){ status.textContent = "No conozco productos concretos para esta búsqueda. Puedes añadirla tal cual."; return; }
      status.textContent = "Resultados de Gemini buscando en internet. Pueden faltar productos o no estar en tu tienda de Almería.";
      sheetBody.insertBefore(ul, status);
    }
    function showEntry(html){
      if (!html) return;
      sheetBody.appendChild(h("iframe", {"class":"grounding", title:"Búsquedas de Google relacionadas", sandbox:"allow-popups allow-popups-to-escape-sandbox", srcdoc:html}));
    }
    if (searchCache[key]) { show(searchCache[key].data); showEntry(searchCache[key].entry); return; }

    function run(){
      if (searchCtl) searchCtl.abort();
      searchCtl = new AbortController();
      status.textContent = "Buscando marcas y variedades…";
      var prompt = "Eres el buscador de una app de lista de la compra en España. Supermercado: " + STORES[st] +
        ". El usuario busca: «" + q.slice(0,80) + "».\n" +
        "Busca en internet, sobre todo en " + SITES[st] + ", qué productos concretos relacionados con la búsqueda vende ese supermercado en España (la tienda está en Almería). " +
        "Enumera hasta 24. " +
        "Primero los de su marca propia (" + BRANDS[st] + "), después otras marcas que suele tener. " +
        "Incluye las variedades habituales (tipos, sabores, sin lactosa, integral, etc.). " +
        "Si la búsqueda ya nombra un producto y marca concretos, ponlo el primero. " +
        "Incluye solo productos de los que estés razonablemente seguro; no inventes productos ni precios.\n" +
        "Responde solo con un array JSON de objetos {\"nombre\": nombre del producto con su marca, \"formato\": envase o tamaño habitual o \"\", " +
        "\"categoria\": uno de " + JSON.stringify(CAT_IDS) + "}. " +
        "Ejemplo: [{\"nombre\":\"Tortitas de arroz Hacendado\",\"formato\":\"Paquete 130 g\",\"categoria\":\"despensa\"}]";
      var sig = searchCtl.signal;
      gemini(prompt, {search:true, signal:sig}).catch(function(e){
        // Si la búsqueda web no está disponible para esta clave o modelo, se pregunta sin ella.
        if (e && (e.code === "cancelled" || e.code === "bad_key" || e.code === "network" || e.code === "bad_model")) throw e;
        return gemini(prompt, {signal:sig});
      }).then(function(r){
        if (my !== searchSeq) return;
        searchCache[key] = r; show(r.data); showEntry(r.entry);
      }, function(e){
        if (my !== searchSeq || (e && e.code === "cancelled")) return;
        status.textContent = aiError(e, "buscar") + " ";
        status.appendChild(h("button", {type:"button", text:"Reintentar", on:{click:run}}));
      });
    }
    run();
  }

  /* Aviso con deshacer */
  var toast = document.getElementById("toast"), toastText = document.getElementById("toastText"),
      toastUndo = document.getElementById("toastUndo"), toastTimer = null, undoState = null;
  function say(msg, undo, keep){
    clearTimeout(toastTimer);
    toastText.textContent = msg; undoState = undo || null; toastUndo.hidden = !undo; toast.hidden = false;
    if (!keep) toastTimer = setTimeout(function(){ toast.hidden = true; undoState = null; }, undo ? 8000 : 5000);
  }
  toastUndo.addEventListener("click", function(){
    if (!undoState) return;
    var prev = clean(JSON.parse(undoState)); state.items = prev.items; state.freq = prev.freq;
    undoState = null; toast.hidden = true; commit();
  });

  /* Foto del producto o de la etiqueta */
  function shrink(file, max){
    function draw(src, w, h0){
      var k = Math.min(1, (max || 2000) / Math.max(w, h0)), cv = document.createElement("canvas");
      cv.width = Math.round(w * k); cv.height = Math.round(h0 * k);
      cv.getContext("2d").drawImage(src, 0, 0, cv.width, cv.height);
      return new Promise(function(res, rej){ cv.toBlob(function(b){ b ? res(b) : rej(new Error("blob")); }, "image/jpeg", max ? 0.72 : 0.85); });
    }
    return new Promise(function(res, rej){
      var url = URL.createObjectURL(file), img = new Image();
      img.onload = function(){ draw(img, img.naturalWidth, img.naturalHeight).then(res, rej).then(function(){ URL.revokeObjectURL(url); }); };
      img.onerror = function(){ URL.revokeObjectURL(url); rej(new Error("img")); };
      img.src = url;
    });
  }
  camBtn.addEventListener("click", function(){
    if (!aiOn()){ openSettings("Para leer fotos y tickets hace falta la clave de Gemini. Pégala aquí y pulsa Guardar."); return; }
    camFile.value = ""; camFile.click();
  });
  function thumbOf(file){
    return shrink(file, 360).then(function(b){ return new Promise(function(res, rej){
      var fr = new FileReader(); fr.onload = function(){ res(String(fr.result)); }; fr.onerror = rej; fr.readAsDataURL(b);
    }); });
  }
  var picFile = document.getElementById("picFile"), picTarget = null;
  picFile.addEventListener("change", function(){
    var file = picFile.files && picFile.files[0], id = picTarget;
    if (!file || !id) return;
    thumbOf(file).then(function(d){ if (find(id)) setPhoto(id, d); }, function(){ say("No he podido usar esa foto. Prueba con otra."); });
  });
  camFile.addEventListener("change", function(){
    var file = camFile.files && camFile.files[0];
    if (!file || !aiOn()) return;
    var st = store;
    camBtn.disabled = true; say("Mirando la foto…", null, true);
    shrink(file).then(function(blob){
      var prompt = "La foto viene de una app de lista de la compra en España. Puede mostrar (a) un producto de supermercado o su etiqueta, o (b) un ticket de compra.\n" +
        "Si es un producto: lee la marca y el nombre que se vean en el envase.\n" +
        "Si es un ticket: lista cada producto comprado una sola vez, con un nombre legible en minúsculas normales, expandiendo las abreviaturas evidentes " +
        "(por ejemplo «LECHE SEMI S/LACT» pasa a «Leche semidesnatada sin lactosa»). No añadas marcas que no estén impresas. " +
        "Omite bolsas, descuentos, totales, impuestos y formas de pago. Indica la tienda si el ticket lo dice.\n" +
        "No inventes nada que no se vea en la foto.\n" +
        "Responde solo con un objeto JSON {\"tipo\": \"producto\" | \"ticket\" | \"nada\", \"tienda\": \"mercadona\" | \"consum\" | \"otra\" | \"\", " +
        "\"productos\": [{\"nombre\": nombre del producto, \"formato\": tamaño o envase si se ve o \"\", \"categoria\": uno de " + JSON.stringify(CAT_IDS) + "}]}. " +
        "Para un producto suelto, \"productos\" lleva un solo elemento.";
      return blobB64(blob).then(function(b64){ return gemini(prompt, {image:b64}); });
    }).then(function(res){
      var r = res.data;
      var list = (r && Array.isArray(r.productos) ? r.productos : []).filter(function(p){
        return p && typeof p.nombre === "string" && p.nombre.trim();
      }).slice(0, 80);
      if (!r || r.tipo === "nada" || !list.length){
        say("No he reconocido ningún producto. Prueba con otra foto más cerca y con buena luz."); return;
      }
      if (r.tipo === "ticket"){
        var tst = STORES[r.tienda] ? r.tienda : st, keys = [];
        list.forEach(function(p){ keys.push(addUsual(p.nombre, typeof p.formato === "string" ? p.formato : "", p.categoria, tst)); });
        store = tst; try { localStorage.setItem(LS_STORE, store); } catch(e){}
        commit(); toast.hidden = true;
        openUsuals(keys, "Ticket de " + STORES[tst],
          "He guardado " + keys.length + (keys.length === 1 ? " producto" : " productos") + " en tus habituales de " + STORES[tst] +
          ". Toca los que falten ahora para apuntarlos. Si alguno está mal leído, quítalo con ×.");
        return;
      }
      var one = list[0], before = JSON.stringify(state), prevStore = store;
      store = st; var newId = addItem(one.nombre, typeof one.formato === "string" ? one.formato : "", one.categoria); store = prevStore; render();
      thumbOf(file).then(function(d){ if (find(newId)) setPhoto(newId, d); }, function(){});
      say("Añadido a " + STORES[st] + ": " + one.nombre.trim().slice(0,80), before);
    }, function(e){
      say(aiError(e, "leer la foto"), null, true);
    }).then(function(){ camBtn.disabled = false; });
  });
  document.getElementById("addBtn").addEventListener("click", submit);
  input.addEventListener("keydown", function(e){ if (e.key === "Enter"){ e.preventDefault(); submit(); } });
  input.addEventListener("input", renderChips);

  render();
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function(){});
})();
</script>
</body>
</html>
